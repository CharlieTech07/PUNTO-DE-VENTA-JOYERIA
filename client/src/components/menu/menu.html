<aside class="menu-olimpo">
  <!-- Marca / Logo -->
  <div class="menu-olimpo__marca">
    <img src="logonuevo.png" alt="Olimpo" class="menu-olimpo__emblema">
    <div class="menu-olimpo__nombre">OLIMPO</div>
    <div class="menu-olimpo__rol">HAUTE JOAILLERIE</div>
  </div>

  <div class="menu-olimpo__etiqueta menu-olimpo__titulo">Navegación</div>

  <!-- Lista de Enlaces -->
  <nav class="menu-olimpo__lista">
    @for (item of itemsMenu; track item.vista) {
      <a 
        class="menu-olimpo__item" 
        [routerLink]="item.ruta" 
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: item.ruta === '/inicio' }">
        
        <svg viewBox="0 0 24 24">
          @for (d of item.svgPath; track $index) {
            <path [attr.d]="d"></path>
          }
          @if (item.vista === 'resumen') {
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          }
        </svg>

        <span class="menu-olimpo__texto">{{ item.titulo }}</span>

        @if (item.insignia) {
          <span class="menu-olimpo__insignia">{{ item.insignia }}</span>
        }
      </a>
    }
  </nav>

  <!-- Pie del menú -->
  <div class="menu-olimpo__pie">
    <div class="menu-olimpo__usuario">
      <div class="menu-olimpo__etiqueta">Sesión activa</div>
      <div class="menu-olimpo__usuario-nombre">Administrador</div>
    </div>

    <button type="button" class="menu-olimpo__accion" (click)="alternarTema()">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
      </svg>
      <span>Tema: {{ temaActual }}</span>
    </button>

    <a routerLink="/login" class="menu-olimpo__accion menu-olimpo__accion--tenue">
      <svg viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Salir</span>
    </a>
  </div>
</aside>
