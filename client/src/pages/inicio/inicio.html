<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpo · Home</title>
    <!-- Paleta compartida: va antes para que style.css tome sus colores -->
    <link rel="stylesheet" href="../../styles/tema.css">

    <!-- Menú lateral compartido. Va en el <head> para que no parpadee. -->
    <link rel="stylesheet" href="../../components/menu/menu.css">
    <script src="../../components/menu/menu.ts" data-activo="home"></script>

    <!-- Aquí es donde se conecta tu diseño -->
    <link rel="stylesheet" href="../inicio/inicio.css">
    
    
    <!-- Iconos y Fuentes -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <!-- Inserta el componente del menú -->
<app-menu></app-menu>

<div class="container">
  <header>
    <div class="header-top">
      <span class="subtitle">VITRINA DE MERCANCÍA</span>
      <span class="item-count">{{ products.length }} piezas disponibles</span>
    </div>
    <h1 class="title">Home</h1>
  </header>

  <div class="search-bar">
    <span class="material-icons search-icon">search</span>
    <input type="text" placeholder="Buscar pieza, piedra o metal...">
  </div>

  <div class="grid-container" id="product-grid">
    @for (product of products; track product.id) {
      <div class="card">
        <img [src]="product.imageUrl" [alt]="product.name" class="card-image">
        <div class="product-category">{{ product.category }}</div>
        <h3 class="product-title">{{ product.name }}</h3>
        <div class="product-desc">{{ product.description }}</div>
        <div class="card-footer">
          <span class="price">{{ product.price | currency:'USD':'symbol':'1.0-0' }}</span>
          <button class="btn-add" (click)="agregarAlCarrito(product)">AGREGAR</button>
        </div>
      </div>
    }
  </div>
</div>
</body>
</html>
