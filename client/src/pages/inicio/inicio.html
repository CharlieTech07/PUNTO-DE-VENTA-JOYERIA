<!-- Plantilla de InicioComponent, no un documento HTML.
     Sin <head>: los <link rel="stylesheet"> aquí dentro los inlinea Angular
     como estilos del componente, duplicando tema.css y menu.css. -->
<app-menu></app-menu>

<div class="container">
  <header>
    <div class="header-top">
      <span class="subtitle">VITRINA DE MERCANCÍA</span>
      <span class="item-count">{{ products.length }} piezas disponibles</span>
    </div>
    <h1 class="title">Home</h1>
  </header>

  <div class="search-bar">
    <span class="material-icons search-icon">search</span>
    <input type="text" placeholder="Buscar pieza, piedra o metal...">
  </div>

  <div class="grid-container" id="product-grid">
    @for (product of products; track product.id) {
      <div class="card">
        <img [src]="product.imageUrl" [alt]="product.name" class="card-image">
        <div class="product-category">{{ product.category }}</div>
        <h3 class="product-title">{{ product.name }}</h3>
        <div class="product-desc">{{ product.description }}</div>
        <div class="card-footer">
          <span class="price">{{ product.price | currency:'USD':'symbol':'1.0-0' }}</span>
          <button class="btn-add" (click)="agregarAlCarrito(product)">AGREGAR</button>
        </div>
      </div>
    }
  </div>
</div>
