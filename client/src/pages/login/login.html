<!-- Plantilla de LoginComponent, no un documento HTML.
     Sin <head>: un <link rel="stylesheet"> aquí dentro lo inlinea Angular como
     estilo del componente y duplicaba tema.css. login.css ya entra por los
     styleUrls del componente, y tema.css va global desde angular.json.
     Aquí NO se monta el menú lateral: todavía no hay sesión. -->
  <div class="wrap">
  <div class="brand">
  <img src="logonuevo.png" alt="Olimpo Haute Joaillerie" class="crest">
    <h1>OLIMPO</h1>
    <div class="divider">
      <span></span>
      <span class="tagline">HAUTE JOAILLERIE</span>
      <span></span>
    </div>
  </div>

  <div class="card-shell">
    <div class="card">
      <h2>Bienvenido</h2>
      <p class="sub">Acceda a su vitrina privada</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Campo Email -->
        <div class="field" [class.con-error]="submitted && email?.invalid">
          <label for="email">Correo electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="Ej: olimpo@gmail.com"
            autocomplete="username">
          
          <p class="error" *ngIf="submitted && email?.errors?.['required']">
            El correo es obligatorio.
          </p>
          <p class="error" *ngIf="submitted && email?.errors?.['email']">
            Ingresa un formato de correo válido.
          </p>
        </div>

        <!-- Campo Contraseña -->
        <div class="field" [class.con-error]="submitted && password?.invalid">
          <label for="password">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password">
          
          <p class="error" *ngIf="submitted && password?.errors?.['required']">
            La contraseña es obligatoria.
          </p>
          <p class="error" *ngIf="submitted && password?.errors?.['minlength']">
            Debe tener al menos 8 caracteres.
          </p>
        </div>

        <button type="submit" class="primary" [disabled]="loading">
          {{ loading ? 'INGRESANDO...' : 'INGRESAR A LA VITRINA' }}
        </button>

        <button type="button" class="create">CREAR NUEVA CUENTA</button>
      </form>
    </div>
  </div>
</div>
