<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olimpo Haute Joaillerie · Iniciar sesión</title>
<!-- Paleta compartida: va antes de login.css para que pueda tomar sus tokens -->
<link rel="stylesheet" href="../../styles/tema.css">
<link rel="stylesheet" href="login.css">
<!-- Aquí NO se monta el menú lateral: todavía no hay sesión. -->
</head>
<body>
  <div class="wrap">
  <div class="brand">
  <img src="logonuevo.png" alt="Olimpo Haute Joaillerie" class="crest">
    <h1>OLIMPO</h1>
    <div class="divider">
      <span></span>
      <span class="tagline">HAUTE JOAILLERIE</span>
      <span></span>
    </div>
  </div>

  <div class="card-shell">
    <div class="card">
      <h2>Bienvenido</h2>
      <p class="sub">Acceda a su vitrina privada</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Campo Email -->
        <div class="field" [class.con-error]="submitted && email?.invalid">
          <label for="email">Correo electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="Ej: olimpo@gmail.com"
            autocomplete="username">
          
          <p class="error" *ngIf="submitted && email?.errors?.['required']">
            El correo es obligatorio.
          </p>
          <p class="error" *ngIf="submitted && email?.errors?.['email']">
            Ingresa un formato de correo válido.
          </p>
        </div>

        <!-- Campo Contraseña -->
        <div class="field" [class.con-error]="submitted && password?.invalid">
          <label for="password">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password">
          
          <p class="error" *ngIf="submitted && password?.errors?.['required']">
            La contraseña es obligatoria.
          </p>
          <p class="error" *ngIf="submitted && password?.errors?.['minlength']">
            Debe tener al menos 8 caracteres.
          </p>
        </div>

        <button type="submit" class="primary" [disabled]="loading">
          {{ loading ? 'INGRESANDO...' : 'INGRESAR A LA VITRINA' }}
          <!-- Agrega este párrafo antes del botón submit en login.html -->
          <p class="error-servidor" *ngIf="errorMessage" style="color: #e57373; font-size: 0.9rem; margin-bottom: 12px; text-align: center;">
            {{ errorMessage }}
          </p>
        </button>

        <button type="button" class="create">CREAR NUEVA CUENTA</button>
      </form>
    </div>
  </div>
</div>

  <script src="acceso.js"></script>
</body>
</html>
